<style>
/* ===== PALETA (extraída de Artboard_92x-8.png; tons escuros derivados para contraste ≥ 4.5:1) ===== */
:root{
  --bg:#F8F9FA;          /* fundo claro (paleta) */
  --soft:#EADBD7;        /* rosado claro (paleta) */
  --accent:#BD9C8F;      /* bronze (paleta) – só detalhes decorativos e texto sobre fundo escuro */
  --accent-strong:#8C6657; /* bronze escurecido – botões e textos de destaque sobre claro */
  --ink:#2B221F;         /* texto e fundo escuro (derivado do bronze) */
  --muted:#5F5F5F;       /* apoio (cinza da paleta, escurecido) */
  --ink-soft:#4A423F;    /* subtítulo sobre foto de fundo */
  --accent-text:#5E3F33; /* bronze escuro para texto pequeno sobre foto */
  --muted-dark:#B9B2AE;  /* apoio sobre fundo escuro */
  --line:rgba(43,34,31,.14);
  --r:20px;              /* raio único */
  --panel:0px;           /* largura do painel de foto (tablet/notebook) */
  --font:'SN Pro','Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg);overflow-x:hidden;padding-left:var(--panel);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent-strong);outline-offset:3px;border-radius:12px}
.dark :focus-visible,.overlay :focus-visible{outline-color:var(--accent)}

/* ===== foto de fundo (sorteada a cada abertura) ===== */
#bgphoto{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--soft);pointer-events:none}
#bgphoto img{width:100%;height:100%;object-fit:cover;object-position:var(--pm,center);opacity:0;transition:opacity .9s;animation:kb 26s ease-in-out infinite alternate}
#bgphoto.on img{opacity:1}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.1)}}
/* celular / tablet em pé: foto cobre a tela toda, véu leve só para o texto ler bem */
#bgphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(248,249,250,.42),rgba(248,249,250,.58) 55%,rgba(248,249,250,.48))}
@media (min-aspect-ratio:1/1),(min-width:900px){#bgphoto img{object-position:var(--pd,center)}}
/* tablet deitado / notebook: foto num painel lateral, sem véu, bem visível */
@media (min-width:900px){
  :root{--panel:50vw}
  #bgphoto{right:auto;width:var(--panel)}
  #bgphoto::after{background:linear-gradient(90deg,rgba(248,249,250,0) 88%,rgba(248,249,250,.35))}
}

/* luz que segue o dedo/cursor */
#glow{position:fixed;left:0;top:0;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(189,156,143,.26),rgba(189,156,143,0) 65%);transform:translate3d(50vw,30vh,0);transition:opacity .4s;opacity:0}
body.glow-on #glow{opacity:1}

section{position:relative;z-index:1}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:0 20px}

/* ===== entrada em sequência ===== */
.rise{opacity:0;translate:0 12px;animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{to{opacity:1;translate:0 0}}

/* ===== cabeçalho ===== */
.hero{padding:44px 0 8px;text-align:center}
.hero>.rise:first-child{margin-bottom:20px}
.avatar{position:relative;width:132px;height:132px;margin:0 auto}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 40%;border:5px solid var(--bg);position:relative}
.avatar::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px dashed var(--accent);animation:spin 24s linear infinite}
.avatar{animation:breathe 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04)}}
h1{font-size:clamp(30px,8.4vw,38px);line-height:1.05;font-weight:700;letter-spacing:-.035em}
.handle{margin-top:8px;font-size:15px;color:var(--accent-text);font-weight:600;letter-spacing:.01em}
.tagline{margin:10px auto 0;max-width:30ch;font-size:17px;font-weight:500;color:var(--ink)}

/* ===== botão principal ===== */
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;margin-top:28px;padding:0 24px;
  border-radius:var(--r);background:var(--accent-strong);color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em;text-align:center;transition:transform .18s}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:shimmer 3.6s ease-in-out infinite}
@keyframes shimmer{0%,55%{left:-60%}100%{left:130%}}
.card .add:active{transform:scale(.97)}

/* ===== lista de links ===== */
.links{display:grid;grid-template-columns:1fr;gap:12px;padding:20px 0 48px}
.box{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 18px;border:1.5px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-align:left;touch-action:manipulation}
.box .t{flex:1;min-width:0}
.box b{display:block;font-size:17px;font-weight:600;letter-spacing:-.015em}
.box small{display:block;font-size:14px;color:var(--ink-soft);line-height:1.35;margin-top:1px}
.box svg{flex:none;width:22px;height:22px;stroke:var(--accent-strong);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
@media (hover:hover){.box:hover{--tx:6px;box-shadow:0 10px 28px rgba(43,34,31,.10);border-color:var(--accent)}.box:hover svg{transform:translateX(3px)}}

/* ===== efeitos estilo Framer: inclinação 3D, brilho que segue o toque, mola, magnético ===== */
.fx{transform:perspective(720px) translate3d(var(--tx,0px),var(--ty,0px),0) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));
  transition:transform .6s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s,background .35s;will-change:transform}
.fx.live{transition:transform .14s ease-out,box-shadow .3s,border-color .3s,background .35s}
.fx:active{--s:.955}
.box::before,.cta::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;border-radius:inherit;
  background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(189,156,143,.42),rgba(189,156,143,0) 70%)}
.cta::before{background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),rgba(255,255,255,0) 70%)}
.fx.live::before{opacity:1}
.box .t,.box svg{position:relative}
.fx.live{box-shadow:0 14px 34px rgba(43,34,31,.16)}
/* preenchimento que abre a partir do ponto tocado / do cursor */
.box::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:var(--accent-strong);
  clip-path:circle(0% at var(--mx,50%) var(--my,50%));transition:clip-path .55s cubic-bezier(.22,1,.36,1)}
.box.fill::after{clip-path:circle(150% at var(--mx,50%) var(--my,50%))}
.box::before{z-index:0}
.box .t,.box svg{z-index:1}
.box b,.box small,.box svg{transition:color .3s,stroke .3s,transform .3s}
.box.fill{border-color:var(--accent-strong)}
.box.fill b,.box.fill small{color:#fff}
.box.fill svg{stroke:#fff;transform:translateX(5px)}
.cta.fill{background:var(--ink)}

/* aparece ao rolar */
.reveal{opacity:0;translate:0 18px;transition:opacity .6s,translate .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;translate:0 0}

/* ripple */
.rp{position:absolute;border-radius:50%;pointer-events:none;background:rgba(189,156,143,.38);transform:scale(0);animation:rp .6s ease-out forwards}
.cta .rp{background:rgba(255,255,255,.35)}
@keyframes rp{to{transform:scale(1);opacity:0}}

/* ===== títulos de seção ===== */
.sec{padding:56px 0}
.sec h2{font-size:clamp(28px,7.6vw,34px);line-height:1.08;font-weight:700;letter-spacing:-.035em}
.sec .lead{margin-top:8px;font-size:16px;color:var(--muted)}
.soft{background:rgba(234,219,215,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.soft .lead{color:var(--muted)}
.dark{background:rgba(43,34,31,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--bg)}
.dark .lead{color:var(--muted-dark)}

/* ===== serviços ===== */
.cards{display:grid;gap:14px;margin-top:24px}
.card{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r);background:var(--bg)}
.card.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.03);box-shadow:0 0 0 6px rgba(140,102,87,.25)}}
.card .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card h3{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.card p{font-size:15px;color:var(--muted);margin-top:4px}
.price{flex:none;padding:6px 12px;border-radius:999px;background:var(--accent-strong);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.card .add{min-height:48px;border-radius:14px;border:1.5px solid var(--accent-strong);color:var(--accent-strong);font-weight:700;font-size:16px;transition:transform .18s,background .2s,color .2s}
.card.on .add{background:var(--accent-strong);color:#fff}

/* barra fixa de seleção */
#bar{position:fixed;left:calc(var(--panel) + 12px);right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;max-width:496px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:var(--r);background:var(--ink);color:var(--bg);box-shadow:0 14px 40px rgba(43,34,31,.35);transform:translateY(140%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
#bar.show{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#bar .sum{flex:1;font-size:15px;line-height:1.3}
#bar .sum b{display:inline-block;font-weight:700}
#bar .sum b.bump{animation:bump .4s}
@keyframes bump{40%{transform:translateY(-6px) scale(1.25)}}
#bar button{min-height:48px;padding:0 18px;border-radius:14px;background:var(--accent-strong);color:#fff;font-weight:700;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:50;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== rodapé ===== */
footer{position:relative;z-index:1;margin-top:24px;padding:48px 0 56px;text-align:center;background:rgba(43,34,31,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--bg)}
footer img{width:96px;margin:0 auto 10px}
footer a{display:inline-block;padding:8px 4px;font-size:16px;font-weight:700;color:var(--accent)}
footer a:hover{text-decoration:underline;text-underline-offset:4px}
.dev{margin-top:22px;padding-top:18px;border-top:1px solid rgba(248,249,250,.14);font-size:13px;color:var(--muted-dark)}
footer .dev a{padding:6px 2px;font-size:13px;font-weight:700;color:var(--bg)}
.foot-text{margin:4px auto 0;font-size:14px;line-height:1.45;color:var(--muted-dark);text-wrap:balance}
body.has-bar footer{padding-bottom:110px}

/* ===== tela de carregamento / WhatsApp ===== */
.overlay{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:28px 24px;background:#0E0B0A;color:var(--bg);text-align:center;overflow-y:auto}
.overlay.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.ov-logo{position:relative;width:128px;height:128px;margin-bottom:22px;animation:breathe 3s ease-in-out infinite}
.ov-logo img{width:100%;height:100%;object-fit:contain}
.ov-logo::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:spin 1.4s linear infinite}
.overlay h3{font-size:26px;font-weight:700;letter-spacing:-.03em}
.ov-list{margin:14px 0 0;width:100%;max-width:360px;list-style:none;text-align:left;font-size:15px;color:var(--muted-dark)}
.ov-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(248,249,250,.12)}
.ov-list li span:last-child{color:var(--bg);font-weight:600;white-space:nowrap}
.ov-total{margin-top:12px;font-weight:700;font-size:17px}
.ov-prog{width:100%;max-width:360px;height:4px;margin-top:22px;border-radius:4px;background:rgba(248,249,250,.14);overflow:hidden}
.ov-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px}
.overlay.loading .ov-prog i{animation:prog 1s linear forwards}
@keyframes prog{to{width:100%}}
.ov-step1{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px}
.ov-step2{display:none;flex-direction:column;align-items:center;width:100%;max-width:360px}
.overlay.ready .ov-step1{display:none}
.overlay.ready .ov-step2{display:flex}
.ov-open{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;margin-top:22px;border-radius:var(--r);background:var(--accent-strong);color:#fff;font-weight:700;font-size:18px}
.ov-sec{margin-top:10px;display:flex;gap:10px;width:100%}
.ov-sec>*{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:1.5px solid rgba(248,249,250,.28);font-size:15px;font-weight:600;color:var(--bg)}

@media (min-width:600px){
  .wrap{max-width:620px}.hero{padding-top:64px}
}
/* tablet em pé: botões em 2 colunas (como no site) */
@media (min-width:600px) and (max-width:899px){
  .links{grid-template-columns:1fr 1fr}
  .box{min-height:76px}
}
/* notebook largo: coluna de conteúdo com espaço para 2 colunas */
@media (min-width:1200px){
  .links{grid-template-columns:1fr 1fr}
  .box{min-height:76px}
  .hero{padding-top:80px}
}
@media (min-width:900px){ .sec{padding:72px 0} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

<!-- tela preta de carregamento → WhatsApp -->
<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-label="Abrindo o WhatsApp">
  <div class="ov-logo"><img id="ovLogo" alt=""></div>
  <div class="ov-step1">
    <h3>Preparando seu pedido</h3>
    <ul class="ov-list" id="ovList"></ul>
    <div class="ov-total" id="ovTotal" hidden></div>
    <div class="ov-prog"><i></i></div>
  </div>

    <h3>Abrindo o WhatsApp</h3>
    <a class="ov-open" id="ovOpen" href="#" target="_blank" rel="noopener noreferrer">Abrir o WhatsApp</a>
    <div class="ov-sec">
      <button type="button" id="ovBack">Voltar</button>
      <a id="ovAlt" href="#" target="_blank" rel="noopener noreferrer">Não abriu? Usar link alternativo</a>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — EDITE AQUI (textos, links, preços, número do WhatsApp)
   ===================================================================== */
const CONFIG = {
  name: "Dra. Eleniza Mororó",
  handle: "@draelenizamororo",                  // vazio = não mostra
  instagramUrl: "https://www.instagram.com/draelenizamororo/",
  footerText: "Dra. Eleniza Mororó • Dentista Estética | CRO-CE 15103",
  devName: "Railson Lima",
  devUrl: "instagram://user?username=railsonnlima",
  tagline: "Clínica Geral e Odontologia Estética",

  whatsapp: "5588981347708",                    // número com DDI+DDD, só dígitos
  defaultMessage: "Olá! Vim pelo Instagram e gostaria de agendar uma avaliação.",
  mainButtonLabel: "Agendar avaliação no WhatsApp",

  /* Lista de links (máx. 6). type: "whatsapp" | "url" | "anchor"
     whatsapp → abre a tela de carregamento; message é opcional. */
  links: [
    { type: "whatsapp", title: "Tratamento de canal", sub: "Saiba mais pelo WhatsApp",
      message: "Olá! Vim pelo Instagram e gostaria de saber mais sobre tratamento de canal." },
    { type: "whatsapp", title: "Saúde gengival", sub: "Saiba mais pelo WhatsApp",
      message: "Olá! Vim pelo Instagram e gostaria de saber mais sobre saúde gengival." },
    { type: "whatsapp", title: "Cirurgia oral", sub: "Saiba mais pelo WhatsApp",
      message: "Olá! Vim pelo Instagram e gostaria de saber mais sobre cirurgia oral." },
    { type: "whatsapp", title: "Clareamento dental", sub: "Saiba mais pelo WhatsApp",
      message: "Olá! Vim pelo Instagram e gostaria de saber mais sobre clareamento dental." },
    { type: "whatsapp", title: "Laserterapia", sub: "Saiba mais pelo WhatsApp",
      message: "Olá! Vim pelo Instagram e gostaria de saber mais sobre laserterapia." },
    { type: "whatsapp", title: "Procedimentos estéticos", sub: "Saiba mais pelo WhatsApp",
      message: "Olá! Vim pelo Instagram e gostaria de saber mais sobre procedimentos estéticos." }
  ],

  /* Serviços com preço (opcional). Vazio = a seção não aparece.
     Exemplo: { name: "Limpeza", price: 150, desc: "Remove tártaro e deixa o sorriso leve." } */
  servicesTitle: "Serviços",
  servicesLead:  "Escolha o que precisa e peça pelo WhatsApp.",
  services: [],

  /* Mensagem enviada quando há serviços escolhidos */
  msgIntro: "Olá! Vim pelo Instagram.",
  msgOutro: "Gostaria de confirmar escopo, prazo e orçamento.",

  loadingMs: 1000   // duração da tela preta antes do botão "Abrir o WhatsApp"
};
/* ===================================================================== */

const $ = (s, r=document) => r.querySelector(s);
const brl = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:(n%1?2:0)});
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8) }catch(e){} };
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const selected = new Map();

/* ---------- textos ---------- */
document.title = CONFIG.name + " | " + CONFIG.tagline;
$('#name').textContent = CONFIG.name;
$('#footText').textContent = CONFIG.footerText;
$('#devLink').textContent = CONFIG.devName; $('#devLink').href = CONFIG.devUrl;
$('#tagline').textContent = CONFIG.tagline;
$('#mainCta').textContent = CONFIG.mainButtonLabel;
if (CONFIG.handle){ const h=$('#handle'); h.textContent=CONFIG.handle; h.hidden=false;
  const f=$('#footHandle'); f.textContent=CONFIG.handle; f.hidden=false; f.href=CONFIG.instagramUrl||'#'; if(!CONFIG.instagramUrl) f.removeAttribute('target'); }

/* ---------- links ---------- */
const nav = $('#links');
CONFIG.links.slice(0,6).forEach((l,i)=>{
  const el = document.createElement(l.type==='whatsapp' ? 'button' : 'a');
  el.className = 'box rise'; el.style.setProperty('--i', 5+i); el.setAttribute('data-ripple','');
  if (l.type==='whatsapp') el.type='button';
  else { el.href=l.href; if(l.type==='url'){ el.target='_blank'; el.rel='noopener noreferrer'; } }
  el.innerHTML = '<span class="t"><b></b><small></small></span>'+ARROW;
  $('b',el).textContent = l.title; $('small',el).textContent = l.sub||'';
  if (l.type==='whatsapp') el.addEventListener('click',()=>startWhatsApp(l.message));
  nav.appendChild(el);
});
$('#mainCta').addEventListener('click',()=>startWhatsApp());

/* ---------- serviços ---------- */
if (CONFIG.services.length){
  $('#servicos').hidden = false;
  $('#svcTitle').textContent = CONFIG.servicesTitle; $('#svcLead').textContent = CONFIG.servicesLead;
  document.body.classList.add('has-bar');
  CONFIG.services.forEach((s,i)=>{
    const c = document.createElement('article'); c.className='card';
    c.innerHTML = '<div class="row"><div><h3></h3><p></p></div><span class="price"></span></div><button type="button" class="add" data-ripple></button>';
    $('h3',c).textContent=s.name; $('p',c).textContent=s.desc||''; $('.price',c).textContent=brl(s.price);
    const btn=$('.add',c); btn.textContent='+ Adicionar'; btn.setAttribute('aria-pressed','false');
    btn.addEventListener('click',()=>{
      const on = !selected.has(i);
      on ? selected.set(i,s) : selected.delete(i);
      c.classList.toggle('on',on); btn.textContent = on ? 'Adicionado ✓' : '+ Adicionar'; btn.setAttribute('aria-pressed',on);
      c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
      buzz(); toast((on?'Adicionado: ':'Removido: ')+s.name); updateBar(true);
    });
    $('#cards').appendChild(c);
  });
}
function total(){ let t=0; selected.forEach(s=>t+=s.price); return t }
function updateBar(bump){
  const n=selected.size, bar=$('#bar');
  bar.classList.toggle('show',n>0);
  $('#barSum').innerHTML = '<b id="cnt">'+n+'</b> '+(n===1?'serviço':'serviços')+' · <b>'+brl(total())+'</b>';
  if(bump){ const c=$('#cnt'); c.classList.add('bump') }
}
$('#barBtn').addEventListener('click',()=>startWhatsApp());
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800) }

/* ---------- WhatsApp: tela preta → botão wa.me ---------- */
function buildMessage(custom){
  if(!selected.size) return custom || CONFIG.defaultMessage;
  const lines=[CONFIG.msgIntro,''];
  let i=1; selected.forEach(s=>lines.push((i++)+'. '+s.name+' — '+brl(s.price)));
  lines.push('','Total de referência: '+brl(total()),'',CONFIG.msgOutro);
  return lines.join('\n');
}
let timer;
function startWhatsApp(custom){
  buzz();
  const msg = buildMessage(custom), num = (CONFIG.whatsapp||'').replace(/\D/g,'');
  const url = 'https://wa.me/'+num+'?text='+encodeURIComponent(msg);
  const alt = 'https://api.whatsapp.com/send?'+(num?'phone='+num+'&':'')+'text='+encodeURIComponent(msg);
  const ov=$('#ov'), list=$('#ovList');
  list.innerHTML='';
  selected.forEach(s=>{ const li=document.createElement('li'); li.innerHTML='<span></span><span></span>'; li.children[0].textContent=s.name; li.children[1].textContent=brl(s.price); list.appendChild(li) });
  $('#ovTotal').hidden = !selected.size; $('#ovTotal').textContent = 'Total de referência: '+brl(total());
  $('#ovOpen').href=url; $('#ovAlt').href=alt;
  ov.classList.remove('ready','loading'); ov.classList.add('open'); void ov.offsetWidth; ov.classList.add('loading');
  document.body.style.overflow='hidden';
  clearTimeout(timer);
  timer=setTimeout(()=>{
    ov.classList.remove('loading'); ov.classList.add('ready');
    /* hospedagem própria (fora de quadro): segue na mesma aba. Em pré-visualização (iframe), fica o botão. */
    if (window.top===window.self) location.href=url;
  }, CONFIG.loadingMs);
}
function closeOverlay(){ clearTimeout(timer); $('#ov').classList.remove('open','ready','loading'); document.body.style.overflow='' }
$('#ovBack').addEventListener('click',closeOverlay);
window.addEventListener('pageshow',closeOverlay);

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay() });

/* ---------- ripple ---------- */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-ripple]'); if(!t) return;
  const r=t.getBoundingClientRect(), d=Math.max(r.width,r.height)*2, s=document.createElement('span');
  s.className='rp'; s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  t.appendChild(s); setTimeout(()=>s.remove(),620);
});

/* ---------- luz que segue o dedo/cursor ---------- */
const glow=$('#glow');
function moveGlow(x,y){ glow.style.transform='translate3d('+x+'px,'+y+'px,0)'; document.body.classList.add('glow-on') }
addEventListener('pointermove',e=>moveGlow(e.clientX,e.clientY),{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) moveGlow(t.clientX,t.clientY)},{passive:true});
if(!matchMedia('(prefers-reduced-motion:reduce)').matches) setTimeout(()=>moveGlow(innerWidth/2,innerHeight*.3),300);

$('#ovLogo').src=$('#footLogo').src;

/* ---------- foto de fundo: muda a cada atualização ---------- */
(function(){
  /* mesma ordem das fotos da galeria: clínica, retrato, criança.
     pm = enquadramento no celular (retrato) · pd = no desktop (paisagem) */
  const FOCUS=[{pm:'36% 50%',pd:'42% 55%'},{pm:'50% 28%',pd:'50% 30%'},{pm:'56% 30%',pd:'52% 36%'}];
  const imgs=[...document.querySelectorAll('#bgsrc img')]; if(!imgs.length) return;
  let last=-1; try{ last=parseInt(localStorage.getItem('bgLast'),10); if(isNaN(last)) last=-1 }catch(e){}
  let i; do{ i=Math.floor(Math.random()*imgs.length) }while(imgs.length>1 && i===last);
  try{ localStorage.setItem('bgLast',i) }catch(e){}
  const box=$('#bgphoto'), im=$('img',box), f=FOCUS[i]||{};
  if(f.pm) box.style.setProperty('--pm',f.pm); if(f.pd) box.style.setProperty('--pd',f.pd);
  im.onload=()=>box.classList.add('on'); im.src=imgs[i].src; if(im.complete) box.classList.add('on');
})();
/* ---------- preenchimento ao passar o mouse / tocar ---------- */
(function(){
  function pos(el,e){ const r=el.getBoundingClientRect(); el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); el.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%') }
  function bindFill(el){
    let t;
    const on=e=>{ clearTimeout(t); pos(el,e); el.classList.add('fill') };
    const off=(e,delay)=>{ clearTimeout(t); if(e) pos(el,e); t=setTimeout(()=>el.classList.remove('fill'),delay) };
    el.addEventListener('pointerenter',e=>{ if(e.pointerType!=='touch') on(e) });
    el.addEventListener('pointerdown',on);
    el.addEventListener('pointerleave',e=>{ if(e.pointerType!=='touch') off(e,0) });
    el.addEventListener('pointerup',e=>{ if(e.pointerType==='touch') off(e,500) });
    el.addEventListener('pointercancel',()=>off(null,0));
    el.addEventListener('focus',()=>{ if(el.matches(':focus-visible')){ el.style.setProperty('--mx','50%'); el.style.setProperty('--my','50%'); el.classList.add('fill') } });
    el.addEventListener('blur',()=>off(null,0));
  }
  document.querySelectorAll('.box').forEach(bindFill); bindFill($('#mainCta'));
})();

/* ---------- efeitos Framer: inclinação 3D + brilho + magnético, com mola ---------- */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  function bind(el,tilt,mag){
    el.classList.add('fx');
    const reset=()=>{ el.classList.remove('live'); ['--tx','--ty','--rx','--ry'].forEach(v=>el.style.removeProperty(v)) };
    const move=e=>{
      if(e.pointerType==='touch' && !el.matches(':active')) return;
      const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      el.classList.add('live');
      el.style.setProperty('--mx',(x*100)+'%'); el.style.setProperty('--my',(y*100)+'%');
      el.style.setProperty('--rx',((.5-y)*tilt).toFixed(2)+'deg');
      el.style.setProperty('--ry',((x-.5)*tilt*1.6).toFixed(2)+'deg');
      if(mag){ el.style.setProperty('--tx',((x-.5)*mag).toFixed(1)+'px'); el.style.setProperty('--ty',((y-.5)*mag*.6).toFixed(1)+'px') }
    };
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerdown',move);
    ['pointerleave','pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,reset));
  }
  document.querySelectorAll('.box').forEach(b=>bind(b,7,0));
  bind($('#mainCta'),6,14);
})();

/* ---------- aparece ao rolar ---------- */
(function(){
  const els=document.querySelectorAll('.sec h2,.sec .lead,.card');
  els.forEach(e=>e.classList.add('reveal'));
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return }
  const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target) } }),{threshold:.15});
  els.forEach((e,i)=>{ e.style.transitionDelay=((i%3)*70)+'ms'; io.observe(e) });
})();
